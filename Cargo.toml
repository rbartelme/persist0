[package]
name = "persist0"
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Batched differentiable H0 persistence (MST death indices) for torch"
repository = "https://github.com/rbartelme/persist0"
readme = "README.md"
exclude = ["python/", "tests/", ".venv/", "*.whl", "gpu/"]
keywords = ["tda", "persistent-homology", "mst", "torch"]
categories = ["science", "algorithms"]

[lib]
name = "persist0"
crate-type = ["cdylib", "rlib"]


[dependencies]
numpy = "0.29.0"
pyo3 = { version = "0.29.2", features = ["extension-module", "abi3-py39"] }
rayon = "1.12.0"

[dev-dependencies]
criterion = "0.8.2"
rand = "0.10.2"

[features]
default = []
cuda = []

[[bench]]
name = "h0_bench"
harness = false

[profile.release]
lto = "fat"
codegen-units = 1
